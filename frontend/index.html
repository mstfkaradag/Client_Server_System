<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher App</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Şifreleme Uygulaması</h1>

        <div class="form-group">
            <label>Kullanıcı Adı</label>
            <input type="text" id="username" placeholder="Kullanıcı adı...">
        </div>

        <div class="form-group">
            <label>Şifreleme Yöntemi</label>
            <select name="method" id="method">
                <option value="caesar">Sezar Şifreleme</option>
                <option value="vigenere">Vigenere Şifreleme</option>
                <option value="substitution">Substitution Şifreleme</option>
                <option value="playfair">Playfair Şifreleme</option>
                <option value="rail-fence">Rail Fence Şifreleme</option>
                <option value="route">Rota Şifreleme</option>
                <option value="columnar">ColumnarTransposition</option>
                <option value="pigpen">Pigpen Şifreleme</option>
                <option value="hill">Hill Cipher (Matris)</option>
                <option value="aes-with-lib">AES (Kütüphaneli)</option>
                <option value="des-with-lib">DES (Kütüphaneli)</option>
                <option value="rsa-with-lib">RSA (Kütüphaneli)</option>
                <option value="des-manual">DES Şifreleme (Manuel)</option>
            </select>
        </div>

        <div class="form-group">
            <label id="keyLabel">Anahtar</label>
            <textarea id="key" rows="4" placeholder="Anahtar buraya..."></textarea>
            
            <div style="margin-top: 10px;">
                <button id="genKeyBtn" style="display: none;" onclick="generateRSAKeys()">RSA Anahtar Çifti Oluştur</button>
            </div>
        </div>

        <div class="form-group" id="privateKeyGroup" style="display: none;">
            <label style="color: #d63031;">Private Key (Deşifreleme İçin)</label>
            <textarea id="privateKey" rows="4" placeholder="Private Key buraya gelecek..."></textarea>
        </div>

        <div class="form-group" id="alphabetGroup" style="display: none;">
            <label for="alphabet">Küçük Harfler Alfabesi</label>
            <input type="text" id="alphabet">
        </div>

        <div class="form-group">
            <label>Mesaj Geçmişi</label>
            <ul id="messageList" class="message-list"></ul>
        </div>

        <div class="form-group">
            <label>Mesaj</label>
            <textarea name="message" id="message" rows="4"></textarea>
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" id="showDecrypted">
                Deşifreli Görünüm
            </label>
        </div>

        <button id="sendBtn" onclick="processMessage()">Gönder</button>
        <button id="clearHistoryBtn" onclick="clearHistory()">Geçmişi Temizle</button>

    </div>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"
        integrity="sha384-mkQ3/7FUtcGyoppY6bz/PORYoGqOl7/aSUMn2ymDOJcapfS6PHqxhRTMh1RR0Q6+"
        crossorigin="anonymous"></script>

    <script src="/static/js/script.js"></script>
</body>
</html>
