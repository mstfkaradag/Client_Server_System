<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher App</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Şifreleme Uygulaması</h1>

        <div class="form-group">
            <label>Şifreleme Yöntemi</label>
            <select name="method" id="method">
                <option value="caesar">Sezar Şifreleme</option>
                <option value="vigenere">Vigenere Şifreleme</option>
                <option value="substitution">Substitution Şifreleme</option>
                <option value="playfair">Playfair Şifreleme</option>
            </select>
        </div>

        <div class="form-group">
            <label id="keyLabel">Anahtar(Substitution için büyük alfabe)</label>
            <input type="text" id="key">
        </div>

        <div class="form-group" id="alphabetGroup" style="display: none;">
            <label for="alphabet">Küçük Harfler Alfabesi</label>
            <input type="text" id="alphabet">
        </div>

        <div class="form-group">
            <label>Mesaj Geçmişi</label>
            <ul id="messageList" class="message-list"></ul>
        </div>

        <div class="form-group">
            <label>Mesaj</label>
            <textarea name="message" id="message" rows="4"></textarea>
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" id="showDecrypted">
                Deşifreli Görünüm
            </label>
        </div>

        <button id="sendBtn" onclick="processMessage()">Gönder</button>
        <button id="clearHistoryBtn" onclick="clearHistory()">Geçmişi Temizle</button>

    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
